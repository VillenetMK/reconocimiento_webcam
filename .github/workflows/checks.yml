name: Verificar webcam

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar PyTorch para CPU y dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Comprobar dependencias y pruebas de la aplicacion
        run: |
          python PY1.PY --diagnostico
          python -m unittest discover -s tests -v
          python PY1.PY --autoprueba
      - name: Verificar iniciador de Windows
        if: runner.os == 'Windows'
        shell: cmd
        env:
          WEBCAM_NO_PAUSE: '1'
        run: INICIAR.bat --diagnostico
